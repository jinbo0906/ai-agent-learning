  - id: ch08
    num: 8
    title: Agent 的持续进化
    source: book/chapter8.md
    cjk_chars: 15735
    read_hours: 1.5
    level: 专家
    week: [15]
    note: 正文全书最短，但实验最有价值 —— 旗舰章最强候选之一
    objectives:
      - 从运行轨迹中提取可信学习信号
      - 比较把经验写入知识、指令、程序和参数的边界
      - 设计验证、灰度、发布和回滚
      - 区分“任务完成”“指标提升”和“能力进化”
      - 划分可修改组件与不可修改的可信根
    must_answer:
      - 新失败是推翻旧经验，还是改变适用条件？
      - 为什么用户满意度不能作为唯一学习信号？
      - 同一问题何时改 Prompt、Harness 还是参数？
      - 自修改系统中什么必须保持不可修改？
      - 经验知识库如何版本化、淘汰和解决冲突？
    default_lab:
      path: chapter8/trajectory-verifier
      status: ok
      note: 第一步用它，第二步再从 alternatives 里选一个
    lab_requirements:
      - "第一步：对成功 / 部分成功 / 失败三类轨迹生成带证据的诊断，区分环境结果、过程规则、语言 Rubric，检查诊断是否引用真实轨迹位置"
      - "第二步：从 alternatives 选一个，必须比较更新前后，包含保留集、边界集和回滚"
    alternatives:
      - chapter8/prompt-auto-optimization
      - chapter8/self-modifying-agent
      - chapter8/self-evolution-eval
    article:
      title: Agent 持续进化的起点不是自修改，而是可信学习信号
      must_include:
        - 更新前后 + 保留集 + 边界集的三方对照
        - 一次回滚记录
    pass_criteria:
      - 更新建议能追溯到轨迹证据
      - 改进在保留集上无不可接受退化
      - 更新产物有版本
      - 可以回滚
      - 不允许 Agent 修改批准自身更新的可信根
    quiz_anchors:
      - 如何判断新失败推翻了旧经验，还是改变了适用条件？
      - 知识、指令、程序和参数分别适合承载什么更新？
      - 什么是不可修改的可信根？
    attest_milestone:
      version: v3
      what: 自我进化闭环 —— 从十章历史评分轨迹自动提 rubric/prompt 改进 -> 校准集验证 -> 发布或回滚；可信根（评分公式、门控规则、校准集）标记为不可自动修改
      uses: 第 8 章 持续进化
    connects_to:

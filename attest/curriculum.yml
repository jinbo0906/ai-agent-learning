  # ----------------------------------------------------------
  - id: ch07
    num: 7
    title: 模型后训练
    source: book/chapter7.md
    cjk_chars: 37344
    read_hours: 3.0
    level: 专家
    week: [13, 14]
    note: 正文全书最长
    objectives:
      - 解释预训练、SFT 和 RL 的目标与数据差异
      - 判断能力应写入上下文、Skill、程序、知识库还是参数
      - 理解数据质量、环境、奖励和算法的优先级
      - 理解多轮信用分配、过程奖励和结果奖励
      - 识别灾难性遗忘、reward hacking 和评估集污染
    must_answer:
      - 何时应从 SFT 切换到 RL？
      - 如何决定一项能力进入参数还是上下文？
      - Agentic 轨迹中哪些 token 应学习，哪些不应学习？
      - 多轮任务的奖励如何归因？
      - 如何同时提升目标能力并保护通用能力？
    default_lab:
      path: null
      status: fix
      note: "【修正 A】原方案强制 chapter7/continued-pretraining，但其 README 要求 Mistral-7B + 24GB 显存，与“0.6B-1.5B 小模型”自相矛盾。改为按算力三选一"
    fix:
      id: A
      problem: 强制默认基线需要 24GB 显存，与方案自述的小模型要求冲突，无卡者被硬卡死
      hard_requirements:
        - 有真实的前向、反向、参数更新（不接受伪代码，不接受只贴训练日志样例）
        - 训练前后使用同一套评估，同时报告目标能力和能力保留集
        - "记录：数据来源与过滤、学习率/batch/步数/随机种子、训练时长与显存、训练 loss、目标任务变化、保留集变化、至少一个失败或退化案例"
      paths:
        - id: P1
          condition: 有 >=24GB GPU（RTX 4090 / A100）
          lab: chapter7/continued-pretraining
          how: 沿用原路径（Mistral-7B + LoRA + 韩语续训 -> SFT），自带三阶段对比脚本和灾难性遗忘处理，最完整
        - id: P2
          condition: 有 8-16GB GPU 或云 Notebook（推荐大多数人）
          lab: chapter7/cot-distillation
          how: 换基座为 Qwen2.5-0.5B 或 1.5B 做 LoRA SFT，50-200 步。数据用 cot-distillation 生成并规则过滤。目标能力选一个可自动验证的窄任务（如固定格式工具调用生成），保留集用通用问答 20 题
        - id: P3
          condition: 完全无 GPU
          lab: chapter7/MiniMind-pretrain
          how: 训一个极小模型（几十 M 参数），CPU 可跑通完整预训练->SFT。任务效果差但参数更新真实，能亲眼看到 loss 下降与灾难性遗忘
          better: 强烈建议改租按小时 GPU（约 2-4 元/小时，本实验 3 小时内完成，总成本 <15 元）走 P2
    article:
      title: 能力应该写进权重，还是留在上下文、Skill 与程序里？
      must_include:
        - 训练前后同一评估的目标集与保留集对照
        - 一个失败或退化案例
    pass_criteria:
      - 有真实训练或微调代码路径
      - 训练前后使用相同评估
      - 同时报告目标能力和保留能力
      - 不用训练 loss 代替任务效果
      - 能解释数据、环境、奖励和算法的优先级
      - 能识别评估泄漏和 reward hacking 风险
    quiz_anchors:
      - SFT 与 RL 的学习信号本质上有何不同？
      - 什么能力应进入参数，什么能力应留在上下文或程序？
      - Agentic 模型蒸馏与普通 Chat 蒸馏有何不同？
    attest_milestone:
      version: v2.8
      optional: true
      what: 小模型预筛 —— 0.5B 判“是否占位 / 是否空泛”，大模型只处理通过预筛的。正好是本章核心取舍：这项能力该放进参数还是放进上下文
      uses: 第 7 章 能力载体选择
    connects_to:
      - {unit: ch06, topic: 评估集与信号}


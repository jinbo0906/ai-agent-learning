  - id: ch09
    num: 9
    title: 多模态与实时交互
    source: book/chapter9.md
    cjk_chars: 23445
    read_hours: 1.8
    level: 应用
    week: [16]
    objectives:
      - 比较级联语音、端到端 Omni 和全双工交互
      - 理解流式感知、快慢思考和延迟预算
      - 理解 Computer Use 的动作空间、视觉定位和连续感知
      - 理解机器人中的规划、控制、动作分块和 Sim2Real
      - 设计不可逆行动的安全门
    must_answer:
      - 端到端语音模型如何做可观测性？
      - “边想边说”应在多大程度上模仿人类？
      - GUI 结构化定位失败时如何回退？
      - 离散截图循环如何扩展到连续视觉流？
      - 快思考如何避免造成不可逆后果？
    default_lab:
      path: chapter9/streaming-speech
      status: fix
      note: "【修正 C】其 README 明确必须用 OpenAI 直连 Key（whisper-1 / tts-1），OpenRouter 无音频端点无法回退。原方案只字未提"
    fix:
      id: C
      problem: 默认实验需要 OpenAI 直连 Key；--offline 模式无真实 ASR 延迟，指标会是空的
      decision_tree:
        - condition: 有 OpenAI 直连 Key
          action: 原路径，全部指标真实
        - condition: 无 OpenAI Key，但有国内 ASR（阿里 / 讯飞 / 硅基流动 SenseVoice）
          action: 改造 streaming-speech 的 ASR 后端，机制不变（按递增前缀切片 + 逐片识别）。这个改造本身就是很好的实验证据，比直接跑通原版更能证明理解了机制
        - condition: 都没有
          action: 改用 chapter9/controllable-tts 或 live-audio，把“延迟 vs 质量”权衡换到 TTS 侧。--offline 仅用于验证切片逻辑，不作为指标来源
    lab_requirements:
      - 比较整段识别与递增流式识别（或等价的两个架构基线）
      - 记录首个可用文本延迟、最终延迟、识别质量、资源开销
      - 使用短句、长句、噪声、中途修正等样本
      - 分析低延迟与稳定性的取舍
    alternatives:
      - chapter9/controllable-tts
      - chapter9/live-audio
      - chapter9/end-to-end-speech
    article:
      title: 多模态 Agent 的核心瓶颈不是“看见和听见”，而是时间与控制
      must_include:
        - 两个架构基线的延迟 / 质量对照
        - 一个因过早决策造成的错误案例
    pass_criteria:
      - 有至少两个架构基线
      - 指标同时覆盖延迟、质量和安全
      - 能描述级联与端到端的调试差异
      - 能为快思考行动设计风险门
      - 不把“可运行”直接等同于“可实时使用”
    quiz_anchors:
      - 级联、端到端和全双工语音架构的核心权衡是什么？
      - Computer Use 的结构化定位和纯视觉定位如何互补？
      - 动作分块为何提高效率，又降低环境响应性？
    attest_milestone:
      version: v3+voice
      optional: true
      what: 语音答辩 —— 费曼讲解改为语音提交，ASR 转写后评分。口头解释比打字快 3 倍，且更难提前准备、更难让 AI 代写
      uses: 第 9 章 流式语音
    connects_to:
      - {unit: ch01, topic: 感知—思考—行动循环}


# ============================================================
# Attest 课程规格（Curriculum Spec）
# ------------------------------------------------------------
# 这是整个学习系统的单一事实源。
# 换一本书 / 换一门课，只需要换这个文件 —— 引擎和证据包结构不变。
#
# 对应学习方案 §5.3「三个可泛化抽象」之 ①
# ============================================================

schema_version: 1

meta:
  id: ai-agent-book
  title: 深入理解 AI Agent：设计原理与工程实践
  author: 李博杰 (bojieli)
  upstream: https://github.com/bojieli/ai-agent-book
  # 书稿与配套实验所在仓库，相对于本仓库根目录
  book_repo: ".."
  learner: jinbo0906
  profile: A            # A=稳健 18 周 / B=高强度 12 周 / C=轻量 12 周
  weeks: 18
  hours_per_week: 7.5
  started_at: 2026-07-29
  total_cjk_chars: 271577

# ------------------------------------------------------------
# 全局完成标准（每章都适用）
# ------------------------------------------------------------
completion_criteria:
  - 六类产出齐套：notes / lab / report / article / quiz / defense
  - attest check 全绿：无占位符、证据可定位、复现命令可执行、报告数字与 summary.json 一致、无密钥泄漏
  - 实验含一个固定基线 + 一个主要变量，保存一条成功轨迹和一条失败轨迹
  - 文章有一个可争辩的独立主张，且至少引用一个自己的实验数字
  - 章节测试总分 >= 80，任一维度 >= 该维度满分的 60%
  - 答辩完成（2 个追问均已作答并评分）

# ------------------------------------------------------------
# 门控（方案 §5.5）：只有 3 条判定，按顺序
# ------------------------------------------------------------
gates:
  order:
    - id: deterministic
      rule: 第 1 层确定性检查失败 -> needs_work（不调用 LLM）
    - id: defense
      rule: 答辩未完成 -> needs_work
    - id: score
      rule: 总分 >= 80 且每维 >= 该维 60% -> done；否则 needs_work
  excellent_threshold: 90     # done 且 >= 90 -> 进入旗舰候选池
  infra_error: 不写分数，只写 last_error，保留上一次有效结果

levels:
  bronze: 十章证据齐套，>=8 章 done，平均分 >= 75
  silver: 十章全部 done，平均分 >= 80，十篇文章过发布门，Attest 到 v2
  gold:   silver + 3 个旗舰实验 + Attest 到 v3 + 总复盘 + D+21 保持率 >= 0.8

# ------------------------------------------------------------
# 间隔复习（方案 §5.7）
# ------------------------------------------------------------
review_schedule:
  - {at: D+2,  form: 3 个概念辨析，每题需说明一个常见误解, minutes: 10}
  - {at: D+7,  form: 1 个新工程场景，必须调用本章 >=2 个概念,   minutes: 15}
  - {at: D+21, form: 1 个跨章迁移题，由已学后续章节生成,        minutes: 20}
retention:
  formula: 间隔测试得分 / 首次通过得分
  good: 0.90
  needs_review: 0.75          # < 0.75 回补学队列

# ------------------------------------------------------------
# 旗舰章选择（第 6 周执行，不预设）
# ------------------------------------------------------------
flagship:
  decide_at_week: 6
  count: 3
  weights:
    demo_relevance: 30        # 是否提供 Attest 不可替代的能力
    gap_filling: 25           # 是否弥补当前实测短板
    cross_chapter_transfer: 20
    evidence_strength: 15
    feasibility: 10
  rule: 每维 0-5 分；每个子分必须引用真实数据（章节成绩 / 实验结果 / 校准误差），没有证据只能记 0

# ============================================================
# 十章单元
# ============================================================
units:

  # ----------------------------------------------------------
  - id: ch01
    num: 1
    title: AI Agent 基础
    source: book/chapter1.md
    cjk_chars: 18911
    read_hours: 1.5
    level: 入门
    week: [1, 2]
    objectives:
      - 用自己的语言解释 Agent = LLM + 上下文 + 工具
      - 从轨迹中定位模型 / 上下文 / 工具 / Harness 各自的作用
      - 画出 ReAct 循环并解释轨迹增长带来的成本
      - 区分工作流、自主 Agent 与混合模式的适用条件
      - 理解模型选择、终止条件、护栏、人工接管与动态风险分级
    must_answer:
      - 模型很强时，为什么 Harness 的价值反而可能增加？
      - Agent 和普通 LLM 调用的边界是什么？
      - 哪些生产故障会让 ReAct 循环无限运行？
      - 一个高风险工具的风险为何可能由参数而非工具名称决定？
      - 哪些场景更适合受限动作空间？
    default_lab:
      path: chapter1/context
      status: ok
      note: 已内置 5 种 context mode，开箱即做消融
    lab_requirements:
      - 固定模型、任务集、采样参数、最大步数
      - 比较至少三组配置：完整上下文 / 移除工具结果或历史轨迹 / 移除或弱化系统提示
      - 记录成功率、平均步数、延迟、token、循环异常
      - 解释每组结果背后的因果链
    alternatives:
      - chapter1/web-search-agent          # Kimi 内置工具：服务端工具 vs 客户端工具
      - chapter1/search-codegen
      - chapter1/learning-from-experience  # RL vs LLM 样本效率：先验知识为何胜过算法
    article:
      title: 模型不是 Agent：真正决定效果的 Harness 是什么
      must_include:
        - Agent 三要素关系图
        - 一组自己的上下文消融数据
        - 一个无限循环或假完成案例
        - 工作流与自主 Agent 的选择框架
    pass_criteria:
      - 能对一条陌生 Agent 轨迹做组件归因
      - 消融实验配置可比较
      - 对失败原因的解释与日志一致
      - 能提出终止、重试、人工移交和风险控制策略
    quiz_anchors:
      - 用一条完整轨迹解释模型、上下文、工具和 Harness 的不同职责
      - “模型即 Agent”与“Harness 更重要”为什么不矛盾？
      - 工作流和自主 Agent 的核心差别是什么？
    attest_milestone:
      version: v0
      what: Agent 循环骨架 —— 读证据（工具）→ 调 LLM 判分（模型）→ 写结果（工具）；终止条件、重试、预算
      uses: 第 1 章 Harness
    connects_to: []

  # ----------------------------------------------------------
  - id: ch02
    num: 2
    title: 上下文工程
    source: book/chapter2.md
    cjk_chars: 33978
    read_hours: 2.5
    level: 入门
    week: [3, 4]
    objectives:
      - 从 API 消息 / Chat Template / token / KV Cache 四层解释上下文
      - 区分 KV Cache 与 Prompt Cache
      - 理解稳定前缀、动态信息、工具列表与缓存命中的关系
      - 能设计系统提示、动态提示、Agent Skills 和状态栏
      - 理解提示注入、上下文污染、压缩损失与子 Agent 隔离
    must_answer:
      - 为什么滑动窗口可能让 Agent 重复调用工具？
      - 如何在不破坏稳定前缀的前提下控制长期轨迹？
      - Prompt 的多人维护为什么会产生“熵增”？
      - 如果模型不知道自己不知道什么，Skill 如何被正确触发？
      - 哪些信息应保留原文，哪些适合摘要，哪些应隔离到子 Agent？
    default_lab:
      path: chapter2/context-compression
      status: warn
      note: ★★★ 难度，API 消耗较大，先设预算
    lab_requirements:
      - 同一任务集与模型
      - 比较无压缩 / 摘要 / 关键信息提取 / 语义压缩
      - 记录 token 降幅、任务保持率、延迟、成本
      - 至少加入一个依赖早期细节的长程任务（关键：没有它压缩看起来永远是好的）
      - 标记压缩后发生的信息丢失类型
      - 给出“何时不应继续压缩”的停止条件
    alternatives:
      - chapter2/kv-cache
      - chapter2/prompt-injection
    article:
      title: 上下文不是聊天记录：Agent 的真正运行时
      must_include:
        - 一张 “API 消息 -> Chat Template -> token -> KV Cache” 数据流图
        - 至少一组压缩或缓存对照数据
    pass_criteria:
      - 能解释动态系统信息为什么会破坏缓存
      - 至少比较三种上下文策略
      - 能指出不可逆压缩风险
      - 结论不把 token 减少直接等同于质量提升
    quiz_anchors:
      - KV Cache 与 Prompt Cache 的作用层级有什么不同？
      - 为什么滑动窗口可能让 Agent 重复执行相同工具？
      - 压缩和子 Agent 隔离分别解决什么问题？
    attest_milestone:
      version: v0.5
      what: 分层上下文 —— 稳定前缀（rubric + 课程规格）+ 动态部分（本章证据）；实测缓存命中的成本下降
      uses: 第 2 章 KV Cache / 稳定前缀
    connects_to:
      - {unit: ch01, topic: ReAct 与 Harness}

  # ----------------------------------------------------------
  - id: ch03
    num: 3
    title: 用户记忆和知识库
    source: book/chapter3.md
    cjk_chars: 27936
    read_hours: 2.0
    level: 进阶
    week: [5, 6]
    positioning: 学习者已有较深 RAG 经验，本章不接受“向量数据库是什么”式基础复述。重点转向记忆写入与冲突、知识时效与治理、混合检索失败边界、结构化索引、Agentic RAG 元认知、可验证检索、隐私与遗忘语义。
    objectives:
      - 区分会话上下文、用户记忆和外部知识
      - 设计记忆的写入、检索、更新、冲突、删除和过期策略
      - 比较稠密、稀疏、混合、重排序、RAPTOR、GraphRAG 和文件系统范式
      - 理解多模态信息转文本时的保真度损失
      - 能设计 Agentic RAG 的搜索触发、停止和证据校验机制
    must_answer:
      - 用户两次提供冲突地址时，记忆系统如何处理？
      - 如何把信息质量、时效和来源可信度引入检索？
      - Agent 不知道自己不知道什么时，如何触发搜索？
      - 什么查询更适合 RAPTOR，什么查询更适合 GraphRAG？
      - 强基座模型是否会让领域知识库消失？
    default_lab:
      path: chapter3/retrieval-pipeline
      status: ok
      note: 已含 dense+sparse+fusion+rerank 与离线 evaluate.py
    lab_requirements:
      - 建立 >=12 个有区分度的查询，需覆盖词汇精确匹配 / 语义改写 / 跨段信息 / 时效冲突四类
      - 比较稠密 / BM25 / 混合 / 神经重排序
      - 记录 Recall@k、NDCG/MRR、延迟、成本
      - 给出错误分类
      - 对至少一个失败类型实施改进并用保留集验证（没有保留集就是在失败样本上过拟合）
    budget_note: 12 个查询需要自己构造，项目不自带。单独预留 1 小时做查询集设计 —— 这一小时的质量决定整个实验的质量。
    alternatives:
      - chapter3/agentic-rag
      - chapter3/structured-index
      - chapter3/contextual-retrieval
      - chapter3/user-memory-evaluation
    article:
      title: 做过 RAG 之后，我认为真正难的是知识治理与可验证检索
      must_include:
        - 至少三个真实或合成失败案例
        - 检索指标与生成答案质量的区别
        - 时效、冲突和删除语义
        - 一项超越基础 RAG 的改进
        - 个人已有实践与本章观点的冲突或修正
    pass_criteria:
      - 不只报告“命中了”，还报告排序与最终答案证据
      - 能描述数据治理生命周期
      - 能解释 Agentic RAG 的收益与额外风险
      - 有保留集，避免只在失败样本上过拟合
    quiz_anchors:
      - 用户记忆和知识库为什么不能共用完全相同的生命周期？
      - RAPTOR 与 GraphRAG 分别适合哪些查询？
      - Agentic RAG 的元认知缺陷是什么？
    attest_milestone:
      version: v1
      what: 证据检索 —— 书稿 + 十章笔记建索引，Judge 打分必须引用原文位置
      uses: 第 3 章 混合检索 + 重排
    connects_to:
      - {unit: ch02, topic: 上下文预算与压缩}

  # ----------------------------------------------------------
  - id: ch04
    num: 4
    title: 工具
    source: book/chapter4.md
    cjk_chars: 27814
    read_hours: 2.0
    level: 进阶
    week: [7, 8]
    objectives:
      - 区分感知、执行和协作工具
      - 评价工具粒度、通用性、描述质量和参数保真
      - 理解 MCP 的价值和协议边界
      - 理解事件驱动异步、运行中打断、长任务取消和优先级队列
      - 设计虚拟身份、权限、审批和隔离执行
    must_answer:
      - MCP 最需要补足的复杂交互能力是什么？
      - 语义优先级应该由规则还是 LLM 判断？
      - 多个相似工具如何选择？
      - Agent 何时应使用独立身份，何时可代表用户？
      - 除主动发现外，还能如何应对工具爆炸？
    default_lab:
      path: chapter4/active-tool-discovery
      status: ok
    lab_requirements:
      - 比较全量注入工具 Schema 与按需发现
      - 覆盖简单、组合、歧义三类任务
      - 记录 prompt token、正确工具率、误选率、延迟、成本
      - 分析至少一个由工具描述或参数设计造成的失败
      - 说明工具发现何时反而增加总成本（最容易被跳过、也最有价值的结论）
    alternatives:
      - chapter4/async-agent
      - chapter4/agent-with-event-trigger
      - chapter4/execution-tools
    article:
      title: 工具越多，Agent 越强吗？从工具发现看能力与上下文的矛盾
      must_include:
        - 工具数量 x 任务复杂度的二维对照数据
        - 一个由工具描述质量造成的失败案例
    pass_criteria:
      - 能为一个工具 Schema 提出可测量的改进
      - 实验覆盖工具数量与任务复杂度两个维度
      - 能设计高风险操作的二次确认
      - 能解释同步模型如何服务异步 Agent
    quiz_anchors:
      - 工具粒度过粗和过细分别有什么后果？
      - MCP 标准化解决了什么，又可能限制什么？
      - 主动工具发现为何能降低上下文成本，也可能增加执行成本？
    attest_milestone:
      version: v1.5
      what: 工具化 —— check/quiz/grade/defend 变成工具 + 主动发现；用自己的系统做本章实验，对比全量注入 vs 按需发现的真实 token
      uses: 第 4 章 工具设计 / 主动发现
    connects_to:
      - {unit: ch01, topic: 动作空间}
      - {unit: ch02, topic: 工具 Schema 与上下文成本}

  # ----------------------------------------------------------
  - id: ch05
    num: 5
    title: Coding Agent 与代码生成
    source: book/chapter5.md
    cjk_chars: 29640
    read_hours: 2.0
    level: 高级
    week: [9, 10]
    objectives:
      - 解释代码为什么是 Agent 的元能力
      - 理解搜索、编辑、执行、测试、调试和恢复闭环
      - 理解 Sessionless 设计、安全沙箱、工件模式和最小权限
      - 能从轨迹判断失败发生在规划、工具、环境还是验证
      - 评价“代码即规则 / 适配器 / UI”的边界
    must_answer:
      - 沙箱安全与能力之间如何取舍？
      - Agent 如何区分应适应的新格式和应上报的异常？
      - 提议者—审核者为何可能收敛到错误偏好？
      - 自动沉淀的规则如何做垃圾回收？
      - “代码即规则”比自然语言规则强在哪里，又弱在哪里？
    default_lab:
      path: chapter5/coding-agent
      status: ok
    lab_requirements:
      - 选一个有明确自动测试的小型修复任务
      - 保存初始失败、Agent 轨迹、补丁、最终测试结果
      - 至少展示一次搜索、编辑、执行和验证
      - 记录步数、token、时间、重试
      - 分析一个无效动作或错误假设
    alternatives:
      - chapter5/log-diagnosis
    article:
      title: 代码为什么是通用 Agent 的元工具：从生成到验证
      must_include:
        - 测试先失败、修复后通过的完整证据链
        - 一次无效动作或错误假设的归因分析
    pass_criteria:
      - 代码在隔离环境运行
      - 有“测试先失败、修复后通过”的证据（只有最终成功截图不算）
      - 有回归测试
      - 能说明 Artifact 模式的安全边界
    quiz_anchors:
      - 为什么代码是元能力，而不仅是另一种工具？
      - Artifact 模式为何节省 token，又引入哪些安全风险？
      - 一次成功补丁为什么不等于持续进化？
    attest_milestone:
      version: v2
      what: 复现检查器 —— 沙箱内执行 reproduce、跑测试、比对 summary.json
      uses: 第 5 章 生成—执行—验证闭环
    connects_to:
      - {unit: ch04, topic: 执行工具与安全}

  # ----------------------------------------------------------
  - id: ch06
    num: 6
    title: Agent 的评估
    source: book/chapter6.md
    cjk_chars: 26513
    read_hours: 2.0
    level: 高级
    week: [11, 12]
    objectives:
      - 设计任务数据集、环境、指标、基线和报告
      - 区分任务成功、过程质量、成本、延迟和安全指标
      - 理解 LLM-as-a-Judge 的偏差、校准和一致性
      - 理解配对比较、ELO、统计显著性和置信区间
      - 能从 benchmark 结果形成假设并设计消融
    must_answer:
      - LLM Judge 可能有哪些系统性盲区？
      - 如何让公开 benchmark 抵抗训练数据泄漏？
      - 主观维度的 Rubric 如何提高可靠性？
      - 在有限预算下如何最大化评估信息量？
      - 为什么成功率提升不一定意味着系统更好？
    default_lab:
      path: chapter6/public-health-reporting-eval
      status: fix
      note: "【修正 B】该项目 README 明确只有 5 个确定性任务，而评估集 >=20 才有统计意义"
    fix:
      id: B
      problem: 方案要求 >=20 任务，默认实验只有 5 个
      resolution: 把“扩展任务集”本身作为本章核心实验，单独预留 2 小时
      steps:
        - "0.5h：跑通原 5 个任务，理解六分制评分器（工具选择 1 / 参数 1 / 答案 2 / 证据 1 / 接地与安全 1）"
        - "1.5h：扩到 20 个任务，必须难度分层 —— >=5 个单工具直答、10 个需组合或多步、5 个有歧义或需拒答。新增任务必须保留确定性验证器，不能全交给 LLM Judge"
        - "第 3 步：至少比较两个系统配置，抽样人工复核 Judge，报告成本与不确定性"
      bonus: 扩展后的任务集是可分享的成果，也是 Attest v2.5 校准集的来源
    lab_requirements:
      - 明确任务分布和难度
      - 同时使用客观验证与语言 Rubric
      - 记录任务成功、工具调用、计算准确性、证据引用、无依据声明
      - 对至少两个系统配置做比较
      - 抽样人工复核 Judge
      - 报告运行成本和不确定性
    alternatives:
      - chapter6/model-benchmark
      - chapter6/agent-cost-analysis
      - chapter6/tts-quality-eval
    article:
      title: Agent 评估不是排行榜，而是工程反馈控制系统
      must_include:
        - 20 任务评估集的难度分层设计
        - Judge 与人工复核的不一致量化
    pass_criteria:
      - 数据集与优化样本隔离
      - 指标能映射到具体改进动作
      - Rubric 含正反例
      - 对 Judge 做过人工校准
      - 报告成本与置信度
      - 不以单一平均分掩盖失败簇
    quiz_anchors:
      - LLM-as-a-Judge 有哪些系统性偏差？
      - 为什么总体平均分可能掩盖严重问题？
      - 评估数据、仿真环境和后训练数据如何保持边界？
    attest_milestone:
      version: v2.5
      critical: true
      what: "Judge 校准（全书最关键的一次集成）—— 用前五章历史评分建校准集，测自洽性 / 位置偏差 / 长度偏差。这一步让系统从玩具变可信"
      uses: 第 6 章 评估方法论（100% 用上）
    connects_to:
